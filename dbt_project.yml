name: carrum
version: "1.0.0"
config-version: 2
profile: carrum

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  as_of_date: "2026-06-30"
  data_dir: "data"

models:
  carrum:
    # Write model and column descriptions into the DuckDB file as comments, so a reader of the
    # database alone (person or LLM) sees the definitions.
    +persist_docs:
      relation: true
      columns: true
    # Medallion layers; the physical schema is the layer name (see macros/generate_schema_name.sql).
    bronze:
      +schema: bronze
      +materialized: view    # thin copy of each CSV; reads the files in place
    silver:
      +schema: silver
      +materialized: table   # tables, so queries work without the CSVs on a relative path
    gold:
      +schema: gold
      +materialized: table
