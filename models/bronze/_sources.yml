version: 2

# Raw CSVs are read in place via dbt-duckdb external locations (no seeds).
sources:
  - name: raw
    meta:
      external_location: "{{ var('data_dir') }}/{name}.csv"
    tables:
      - name: salesforce_accounts
        description: Employer client accounts (Salesforce).
      - name: salesforce_programs
        description: One row per employer benefit program (Salesforce).
      - name: contract_fee_schedule
        description: Contract fee lines (CASE_RATE / PLATFORM_FEE) from the contracting system.
      - name: care_platform_episodes
        description: Episode status-change log from the care platform, extracted 2026-06-30.
      - name: netsuite_billing_adjustments
        description: Credits, guarantee true-ups and fees posted by Finance in NetSuite.
