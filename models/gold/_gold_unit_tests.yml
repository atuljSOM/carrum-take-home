  # ---------------------------------------------------------------- gold_agg_revenue_employer_monthly
  - name: ut_agg_revenue_program_month_components_and_total
    description: >
      All of a program's revenue lines in a month collapse to one row with its program name and
      service line. Total = case + platform + adjustments (a negative adjustment reduces it); gross
      and discount cover fee revenue only. Revenue with no valid program (an orphan fee line, a memo
      on an unknown program) lands on one UNATTRIBUTED row.
    model: gold_agg_revenue_program_monthly
    given:
      - input: ref('gold_fact_revenue_monthly')
        rows:
          - {revenue_component: CASE_RATE,    fee_id: FEE-1, program_id: PRG-1, employer_id: EMP-001, employer_name: Parent, is_unattributed: false, revenue_month: 2026-04-01, episode_count: 1, gross_usd: 1000.00, discount_usd: 100.00, net_revenue_usd: 900.00, adjustment_usd_posted_after_as_of: 0}
          - {revenue_component: CASE_RATE,    fee_id: FEE-2, program_id: PRG-1, employer_id: EMP-001, employer_name: Parent, is_unattributed: false, revenue_month: 2026-04-01, episode_count: 1, gross_usd: 500.00,  discount_usd: 50.00,  net_revenue_usd: 450.00, adjustment_usd_posted_after_as_of: 0}
          - {revenue_component: PLATFORM_FEE, fee_id: FEE-3, program_id: PRG-1, employer_id: EMP-001, employer_name: Parent, is_unattributed: false, revenue_month: 2026-04-01, gross_usd: 200.00, discount_usd: 0.00, net_revenue_usd: 200.00, adjustment_usd_posted_after_as_of: 0}
          - {revenue_component: ADJUSTMENT,   program_id: PRG-1, employer_id: EMP-001, employer_name: Parent, is_unattributed: false, revenue_month: 2026-04-01, gross_usd: -50.00, discount_usd: 0.00, net_revenue_usd: -50.00, adjustment_usd_posted_after_as_of: -50.00}
          - {revenue_component: CASE_RATE,    fee_id: FEE-9, program_id: null, employer_id: UNATTRIBUTED, employer_name: Unattributed, is_unattributed: true, revenue_month: 2026-04-01, episode_count: 1, gross_usd: 300.00, discount_usd: 0.00, net_revenue_usd: 300.00, adjustment_usd_posted_after_as_of: 0}
          - {revenue_component: ADJUSTMENT,   program_id: PRG-X, employer_id: UNATTRIBUTED, employer_name: Unattributed, is_unattributed: true, revenue_month: 2026-04-01, gross_usd: -10.00, discount_usd: 0.00, net_revenue_usd: -10.00, adjustment_usd_posted_after_as_of: 0}
      - input: ref('gold_dim_programs')
