        - {program_month_id: PRG-1|2026-04, program_name: Cardiac, service_line: Cardiac, completed_episodes: 2, gross_revenue_usd: 1700.00, discount_usd: 150.00, case_revenue_usd: 1350.00, platform_fee_revenue_usd: 200.00, adjustments_usd: -50.00, total_revenue_usd: 1500.00, adjustments_posted_after_as_of_usd: -50.00}
        - {program_month_id: UNATTRIBUTED|2026-04, program_name: Unattributed (no valid program), service_line: null, completed_episodes: 1, gross_revenue_usd: 300.00, discount_usd: 0.00, case_revenue_usd: 300.00, platform_fee_revenue_usd: 0.00, adjustments_usd: -10.00, total_revenue_usd: 290.00, adjustments_posted_after_as_of_usd: 0.00}

