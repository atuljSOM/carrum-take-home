    description: >
      Mid-window line: 30 of 60 days elapsed, 10 projected -> 5 expected; 2 eligible of 3 completed
      -> ratio 0.4, risk 3 x 1000 x 0.9, watch (only 30 days in). Closed line ahead of plan -> risk
      0, no action. Not-started line -> expected 0, ratio null, no action. Established line with
      nothing completed and $181k at risk -> escalate.
    model: gold_agg_pacing_fee_line
    overrides:
      vars: {as_of_date: "2026-06-30"}
    given:
      - input: ref('gold_dim_fee_lines')
        rows:
          - {fee_id: FEE-A, fee_type: CASE_RATE, employer_id: EMP-1, projected_episodes: 10, rate_usd: 1000, discount_rate: 0.1, effective_start: 2026-06-01, effective_end: 2026-07-30}
